services:
  - type: web
    name: resolve-ai
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resolve-ai-db
          property: connectionString
      - key: JWT_KEY
        generateValue: true
      - key: ADMIN_NAME
        value: Gestor Resolve Aí
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOADS_PATH
        value: /app/uploads
    disk:
      name: resolve-ai-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: resolve-ai-db
    plan: free
    databaseName: resolveai
    user: resolveai
    postgresMajorVersion: "18"
